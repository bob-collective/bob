name: Contracts

on: [pull_request]

env:
  FOUNDRY_PROFILE: ci
  BOB_PROD_PUBLIC_RPC_URL: "https://rpc.gobob.xyz/"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1
      - name: Install deps
        run: |
          forge soldeer install
      - name: Run forge tests
        run: |
          forge test -vvv --deny-warnings
      - name: Check fmt
        run: forge fmt --check
      - name: Versions
        run: |
          forge --version
          git submodule status
