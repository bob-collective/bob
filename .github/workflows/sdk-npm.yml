---
name: SDK NPM Publish
on:
  push:
    tags:
      - '*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: sdk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: get sdk version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: check if version already published
        run: |
          if npm view @gobob/bob-sdk@${{ steps.version.outputs.version }} &>/dev/null; then
            echo "Version ${{ steps.version.outputs.version }} already published to npm, skipping publish"
            echo "PUBLISH=false" >> $GITHUB_ENV
          else
            echo "PUBLISH=true" >> $GITHUB_ENV
          fi
      - name: publish to npm
        if: env.PUBLISH == 'true'
        run: |
          if [[ "${{ steps.version.outputs.version }}" == *rc* ]]; then
            npm publish --access public --tag rc
          else
            npm publish --access public
          fi
