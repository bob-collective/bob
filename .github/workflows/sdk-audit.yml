name: SDK Dependency Audit

on:
  pull_request:
    branches:
      - master
    paths:
      - "sdk/package.json"
      - "sdk/package-lock.json"
      - "sdk/pnpm-lock.yaml"
      - ".github/workflows/sdk-audit.yml"
  push:
    branches:
      - master
    paths:
      - "sdk/package.json"
      - "sdk/package-lock.json"
      - "sdk/pnpm-lock.yaml"
      - ".github/workflows/sdk-audit.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - name: Audit dependencies with pnpm
        run: pnpm audit
